[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-market-quant"
version = "0.1.0"
description = "Quantitative service for the personal stock investment platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2.1,<3",
    "pandas>=2.2,<4",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
